{% set name = "django-cookie-consent" %}
{% set version = "1.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/django_cookie_consent-{{ version }}.tar.gz
  sha256: f78a6f9a55c2d7e1daa64118181891d313bf363158825f637ab24e3d0856eb14

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=77.0.3
    - pip
  run:
    - python >={{ python_min }}
    - django >=4.2
    - django-appconf

test:
  imports:
    - cookie_consent
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/django-commons/django-cookie-consent
  summary: Django cookie consent application
  license: BSD-2-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - shawncrawley
