{% set name = "django-cookie-consent" %}
{% set version = "2.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/django_cookie_consent-{{ version }}.tar.gz
  sha256: 06a8178732c7c25685c17cc0d603de275455b38e6f65ca6abc93ec5b4ca4a850

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=77.0.3
    - pip
  run:
    - python >={{ python_min }}
    - django >=4.2
    - django-appconf

test:
  imports:
    - cookie_consent
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/django-commons/django-cookie-consent
  summary: Django cookie consent application
  license: BSD-2-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - shawncrawley
